$for(publications)$
  <article class="post">
    <header>
      <h3>
        <a href="$url$">$title$</a>
      </h3>
      <div>
        $conference$
      </div>
      <div class="post-metadata">
        <time>$year$</time>
        &nbsp;
        $authors$
      </div>
    </header>
    <section>
      <p>$abstract$</p>
    </section>
  </article>
$endfor$
