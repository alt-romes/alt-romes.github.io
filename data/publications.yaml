# - title: "Semantic Linearity in a Lazy Optimising Compiler"
#   authors: "Rodrigo Mesquita, Bernardo Toninho"
#   abstract: "Linear type systems guarantee linear resources are used exactly
#     once. Traditionally, using a resource is synonymous with its syntactic
#     occurrence in the program, however, under the lens of non-strict evaluation,
#     linearity can be further understood semantically, where a syntactic
#     occurrence of a resource does not necessarily entail using that resource when
#     the program is executed. Semantic linearity becomes especially vital when
#     considering the internal language of an optimising compiler, where
#     optimisations heavily rewrite the source program in ways that can often break
#     syntactic linearity but that aim to preserve the program's semantics. We
#     present Linear Core, the first type system that understands semantic
#     linearity in the presence of non-strict evaluation, suitable for the Core
#     intermediate language of the Glasgow Haskell Compiler. We prove Linear Core
#     is sound and guarantees linear resource usage and prove multiple optimising
#     transformations preserve linearity in Linear Core while failing to do so in
#     Core. We have implemented Linear Core as a compiler plugin to validate the
#     system against linearity-heavy libraries, including linear-base."
